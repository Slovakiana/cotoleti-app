# OPS-04: nasadenie servera (Cloudflare Worker) až po zelených testoch.
# Zapnutie (raz, majiteľ):
#   1. Cloudflare → My Profile → API Tokens → šablóna „Edit Cloudflare Workers“ → token ulož do
#      GitHub → Settings → Secrets and variables → Actions → Secrets ako CLOUDFLARE_API_TOKEN (a CLOUDFLARE_ACCOUNT_ID).
#   2. V tom istom mieste → Variables: WORKER_Z_TESTOV = 1.
#   3. Cloudflare → Workers → cotoleti-app → Settings → Builds → vypni automatické nasadenie z GitHubu.
# Kým nie je WORKER_Z_TESTOV = 1, workflow sa preskočí a server sa nasadzuje ako doteraz (Cloudflare Builds).
name: Nasadenie servera (po testoch)
on:
  workflow_run:
    workflows: [Testy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.WORKER_Z_TESTOV == '1' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
