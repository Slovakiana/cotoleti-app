# Nasadenie GitHub Pages až po zelených testoch.
# Zapína sa takto (raz, majiteľ): Settings → Pages → Source: „GitHub Actions“
# a Settings → Secrets and variables → Actions → Variables: PAGES_Z_TESTOV = 1.
# Kým to nie je zapnuté, tento workflow sa preskočí a Pages sa nasadzujú ako doteraz (z vetvy main).
name: Nasadenie (po testoch)
on:
  workflow_run:
    workflows: [Testy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.PAGES_Z_TESTOV == '1' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Len súbory appky (bez servera a testov)
        run: mkdir _site && cp -r index.html privacy.html rules.html sw.js manifest.webmanifest js lib fonts icons splash og og.png _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
