name: Strážca servera
# Každých 30 minút skontroluje, či server beží. Ak nie, GitHub pošle e-mail o zlyhaní.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Server odpovedá a minútový časovač beží
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 20 https://cotoleti-app.radovan-kudela.workers.dev/api/health | grep -q '"ok":true'; then exit 0; fi
            sleep 30
          done
          echo "Server neodpovedá správne"; exit 1
      - name: Produkčný radar má čerstvú snímku
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 15 'https://cotoleti-app.radovan-kudela.workers.dev/api/planes?lat=48.7&lon=19.5&r=40' |
              jq -e '.state == "live" and (.ac | type) == "array"' >/dev/null; then exit 0; fi
            sleep 20
          done
          echo "Radar nemá čerstvú snímku"; exit 1
      - name: Appka na GitHub Pages
        run: curl -fsS --max-time 20 -o /dev/null https://slovakiana.github.io/cotoleti-app/
      - name: Upozornenie na Telegram (ak sú nastavené TG_TOKEN a TG_CHAT)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="🚨 Čo to letí? – server alebo živý radar sú nedostupné. Pozri RUNBOOK.md v repozitári."
