name: Testy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Kontrola syntaxe
        run: for f in js/*.js sw.js server/worker.js; do node --check "$f"; done
      - name: Verzie súborov sedia
        run: node tests/version.test.mjs
      - name: Testy servera (súťaže, bezpečnosť)
        run: node tests/worker.test.mjs
      - name: Šetrenie batérie na pozadí
        run: node tests/background.test.mjs
      - name: Identita
        run: node tests/cid.test.mjs
      - name: Odznaky
        run: node tests/ach.test.mjs
      - name: Lesklé a edície
        run: node tests/shiny_ed.test.mjs
      - name: Rodinné profily (server)
        run: node tests/family.test.mjs
  appka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Playwright
        run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Dymový test appky v prehliadači
        run: python tests/smoke.py
